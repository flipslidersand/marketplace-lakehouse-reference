[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-lakehouse-reference"
version = "0.1.0"
description = "Reference lakehouse architecture for a digital-native marketplace"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "faker>=25.0.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "databricks-sql-connector>=3.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark/display はランタイムインジェクト済み
"notebooks/*.py" = ["F821", "E402"]
# 条件付き import による意図的な順序
"app/main.py" = ["E402"]
