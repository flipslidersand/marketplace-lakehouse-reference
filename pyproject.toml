[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "marketplace-lakehouse-reference"
version = "0.1.0"
description = "Reference lakehouse architecture for a digital-native marketplace"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "streamlit>=1.35.0",
    "databricks-sql-connector>=3.4.0",
    "python-dotenv>=1.0.0",
    "faker>=25.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
