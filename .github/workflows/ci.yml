name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Delta Lake JARs
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: delta-jars-${{ hashFiles('pyproject.toml') }}
          restore-keys: delta-jars-

      - name: Install dependencies
        run: pip install -e ".[dev]" pyarrow

      - name: Run tests
        run: pytest tests/ -v --tb=short
