name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@main
    with:
      python-version: "3.12"
      install-command: "pip install pytest pytest-cov --quiet"
      run-tests: false
      runner: ubuntu-latest
